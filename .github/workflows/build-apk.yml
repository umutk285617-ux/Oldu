name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Android Projesini ve Firebase Yapilandirmasini Otomatik Olustur
      run: |
        mkdir -p app/src/main/java/com/webapk/app app/src/main/assets
        
        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "WebApk"
        include(":app")
        EOF

        # 2. build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
            id("com.google.gms.google-services") version "4.4.1" apply false
        }
        EOF

        # 3. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        EOF

        # 4. app/build.gradle.kts (Firebase Baglantili)
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("com.google.gms.google-services")
        }
        android {
            namespace = "com.webapk.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.webapk.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }
            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("androidx.webkit:webkit:1.10.0")
            implementation(platform("com.google.firebase:firebase-bom:32.8.0"))
            implementation("com.google.firebase:firebase-analytics-ktx")
        }
        EOF

        # 5. Firebase google-services.json
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "249201390850",
            "project_id": "gen-lang-client-0322922802",
            "storage_bucket": "gen-lang-client-0322922802.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:249201390850:android:364516cdbbf2c32b50fe1b",
                "android_client_info": {
                  "package_name": "com.webapk.app"
                }
              },
              "oauth_client": [
                {
                  "client_id": "249201390850-t9ka79lil27aki4e01g7ditgmcqveghf.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyCPgC1k4Wp1GAegBzT0LC3b5WLfK7PkQlA"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "249201390850-t9ka79lil27aki4e01g7ditgmcqveghf.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

        # 6. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="CepBütçe"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/webapk/app/MainActivity.kt
        package com.webapk.app

        import android.annotation.SuppressLint
        import android.os.Bundle
        import android.webkit.WebChromeClient
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView

            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                webView = WebView(this)
                setContentView(webView)
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.webChromeClient = WebChromeClient()
                webView.webViewClient = WebViewClient()
                webView.loadUrl("file:///android_asset/index.html")
            }

            override fun onBackPressed() {
                if (this::webView.isInitialized && webView.canGoBack()) {
                    webView.goBack()
                } else {
                    super.onBackPressed()
                }
            }
        }
        EOF

        # 8. Web App (index.html)
        cat << 'EOF' > app/src/main/assets/index.html
        <!DOCTYPE html>
        <html lang="tr">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>CepBütçe</title>
          <style>
            body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0B1120; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; box-sizing:border-box; text-align:center; }
            .card { background:#1E293B; border-radius:16px; padding:24px; border:1px solid #334155; max-width:360px; width:100%; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
            h1 { font-size:22px; margin-bottom:8px; color:#818CF8; }
            p { font-size:14px; color:#94A3B8; line-height:1.5; }
            .btn { background:#4F46E5; color:#fff; border:none; padding:12px 20px; border-radius:10px; font-weight:600; width:100%; margin-top:16px; font-size:15px; }
          </style>
        </head>
        <body>
          <div class="card">
            <h1>🚀 CepBütçe</h1>
            <p>Uygulamanız Firebase ile başarıyla bağlandı ve APK derlendi!</p>
            <button class="btn" onclick="alert('Uygulama aktif!')">Başla</button>
          </div>
        </body>
        </html>
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
